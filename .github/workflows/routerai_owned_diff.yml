name: Validate RouterAI generated ownership

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate RouterAI generated ownership
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 -m py_compile \
            ./scripts/update_routerai_catalog.py \
            ./scripts/check_routerai_owned_diff.py
          python3 ./scripts/update_routerai_catalog.py --verify-generated
          python3 ./scripts/check_routerai_owned_diff.py \
            --base-ref "origin/$BASE_REF" \
            --head-ref HEAD \
            --head-branch "$HEAD_BRANCH"
