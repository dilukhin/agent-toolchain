name: Validate MP-1 OpenCode Permissions pilot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile MP-1 deployment modules
        run: python -m py_compile setup_opencode_permissions_pilot.py setup_opencode_permissions_pilot_impl.py tests/test_opencode_permissions_pilot_deployment.py tests/test_opencode_permissions_pilot_recovery_guard.py
      - name: Run MP-1 synthetic deployment regressions
        run: |
          python tests/test_opencode_permissions_pilot_deployment.py
          python tests/test_opencode_permissions_pilot_recovery_guard.py

  exact-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate exact MP-0 artifact managed deployment
        run: python tests/run_opencode_permissions_mp1_integration.py
