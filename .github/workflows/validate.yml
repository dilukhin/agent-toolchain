name: Validate setup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 20.12.2
      - name: Install BMAD runtime prerequisite
        shell: powershell
        run: |
          py -3 -m pip install uv
          $scripts = (& py -3 -c "import sysconfig; print(sysconfig.get_path('scripts'))").Trim()
          if (-not $scripts) { throw "Cannot resolve Python scripts directory for uv." }
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $scripts "uv.exe") --version
      - name: Validate Windows PowerShell 5.1 wrapper
        shell: powershell
        run: |
          $wrapper = (Resolve-Path ".\setup_windows.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($wrapper)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "setup_windows.ps1 must use UTF-8 BOM for Windows PowerShell 5.1 compatibility."
          }

          $root = Join-Path $env:RUNNER_TEMP "ps51-wrapper-check"
          $configDir = Join-Path $root "config"
          $stashDir = Join-Path $root "stash"
          $credentialDir = Join-Path $configDir "credentials"
          $skillsDir = Join-Path $root "skills"
          $stateDir = Join-Path $root "state"
          $projectsDir = Join-Path $root "projects"
          $expectedAbsent = @($configDir, $stashDir, $skillsDir, $stateDir, $projectsDir)

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wrapper `
            -ConfigDir $configDir `
            -StashDir $stashDir `
            -CredentialDir $credentialDir `
            -SkillsDir $skillsDir `
            -StateDir $stateDir `
            -ProjectsDir $projectsDir `
            -Check `
            -SkipPackageInstall `
            -SkipDependencyInstall
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 wrapper check failed with exit code $LASTEXITCODE." }

          foreach ($path in $expectedAbsent) {
            if (Test-Path -LiteralPath $path) {
              throw "Read-only wrapper check unexpectedly created: $path"
            }
          }
      - name: Validate migration regressions
        shell: powershell
        run: py -3 .\tests\run_migration_ci.py
      - name: Validate Windows setup and BMAD
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "validate-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "validate-err.txt"
          $proc = Start-Process pwsh -ArgumentList @("-NoProfile", "-File", ".\validate_setup.ps1", "-TestBmad") -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $output = ((Get-Content -LiteralPath $out -Raw -ErrorAction SilentlyContinue) + (Get-Content -LiteralPath $err -Raw -ErrorAction SilentlyContinue))
          Write-Host $output
          if ($proc.ExitCode -ne 0) {
            $annotation = $output.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=Windows full validation::$annotation"
            exit $proc.ExitCode
          }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 20.12.2
      - name: Install BMAD runtime prerequisite
        run: |
          python3 -m pip install uv
          uv --version
      - name: Validate diff whitespace
        run: git diff --check HEAD^ HEAD
      - name: Validate migration regressions
        run: python3 ./tests/run_migration_ci.py
      - name: Validate Linux setup and BMAD
        shell: bash
        run: |
          set +e
          output="$(bash ./validate_setup.sh --bmad 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ $rc -ne 0 ]]; then
            annotation="${output//'%'/'%25'}"
            annotation="${annotation//$'\r'/}"
            annotation="${annotation//$'\n'/'%0A'}"
            printf '::error title=Linux full validation::%s\n' "$annotation"
            exit "$rc"
          fi
