name: Validate agent-toolchain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 20.12.2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install BMAD runtime prerequisite
        shell: powershell
        run: |
          py -3 -m pip install uv
          $scripts = (& py -3 -c "import sysconfig; print(sysconfig.get_path('scripts'))").Trim()
          if (-not $scripts) { throw "Cannot resolve Python scripts directory for uv." }
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $scripts "uv.exe") --version
      - name: Validate Python modules compile
        shell: powershell
        run: |
          py -3 -m py_compile `
            .\bootstrap_core.py `
            .\core_identity.py `
            .\toolchain_state.py `
            .\workspace_trust_contract.py `
            .\setup_workspace_trust.py `
            .\toolchainctl.py `
            .\setup_core.py `
            .\setup_core_adapter.py `
            .\setup_lib.py `
            .\setup_manifest.py `
            .\setup_migration.py `
            .\setup_runtime.py `
            .\setup_runtime_legacy.py `
            .\setup_managed_tools.py `
            .\setup_tool_skills.py `
            .\setup_tool_skills_impl.py `
            .\setup_path.py `
            .\setup_inventory.py `
            .\setup_tools.py `
            .\setup_yc_transitional_guard.py `
            .\yc_transitional_entry.py `
            .\tests\run_managed_tools_integration.py
      - name: Validate transitional YC guard unit tests
        shell: powershell
        run: py -3 -m unittest tests.test_yc_transitional_guard_deployment tests.test_yc_transitional_entry -v
      - name: Validate PowerShell bootstrap and retired interface syntax
        shell: powershell
        run: |
          foreach ($script in @("bootstrap_windows.ps1", "setup_windows.ps1", "install_bmad_windows.ps1", "validate_setup.ps1", "tests/run_core_access_windows.ps1")) {
            $path = (Resolve-Path ".\$script").Path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "PowerShell parse failed for $script`: $($errors -join '; ')" }
          }
      - name: Validate migration regressions
        shell: powershell
        run: py -3 .\tests\run_migration_ci.py
      - name: Validate managed helper exact-ref integration
        shell: powershell
        run: py -3 .\tests\run_managed_tools_integration.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate core access as a standard Windows user
        shell: powershell
        run: .\tests\run_core_access_windows.ps1
      - name: Validate OpenCode core and BMAD regressions
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "validate-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "validate-err.txt"
          $proc = Start-Process pwsh -ArgumentList @("-NoProfile", "-File", ".\validate_setup.ps1", "-TestBmad") -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $output = ((Get-Content -LiteralPath $out -Raw -ErrorAction SilentlyContinue) + (Get-Content -LiteralPath $err -Raw -ErrorAction SilentlyContinue))
          Write-Host $output
          if ($proc.ExitCode -ne 0) {
            $annotation = $output.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=Windows full validation::$annotation"
            exit $proc.ExitCode
          }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 20.12.2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install BMAD runtime prerequisite
        run: |
          python3 -m pip install uv
          uv --version
      - name: Validate diff whitespace
        run: git diff --check HEAD^ HEAD
      - name: Validate Python modules compile
        run: |
          python3 -m py_compile \
            ./bootstrap_core.py \
            ./core_identity.py \
            ./toolchain_state.py \
            ./workspace_trust_contract.py \
            ./setup_workspace_trust.py \
            ./toolchainctl.py \
            ./setup_core.py \
            ./setup_core_adapter.py \
            ./setup_lib.py \
            ./setup_manifest.py \
            ./setup_migration.py \
            ./setup_runtime.py \
            ./setup_runtime_legacy.py \
            ./setup_managed_tools.py \
            ./setup_tool_skills.py \
            ./setup_tool_skills_impl.py \
            ./setup_path.py \
            ./setup_inventory.py \
            ./setup_tools.py \
            ./setup_yc_transitional_guard.py \
            ./yc_transitional_entry.py \
            ./tests/run_managed_tools_integration.py
      - name: Validate transitional YC guard unit tests
        run: python3 -m unittest tests.test_yc_transitional_guard_deployment tests.test_yc_transitional_entry -v
      - name: Validate read-only P0 metrics
        run: python3 -m unittest tests.test_opencode_permissions_pilot_metrics -v
      - name: Validate P0 metrics CLI without state
        run: |
          temp_home="$(mktemp -d)"
          HOME="$temp_home" AGENT_TOOLCHAIN_STATE_DIR="$temp_home/state" python3 ./toolchainctl.py p0 metrics > "$temp_home/result.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1], encoding="utf-8")) == {"status": "no_data", "reason": "no_active_artifact"}' "$temp_home/result.json"
          test ! -e "$temp_home/state"
          test ! -e "$temp_home/.local"
      - name: Validate shell bootstrap and retired interface syntax
        run: |
          bash -n ./bootstrap_linux.sh
          bash -n ./setup_linux.sh
          bash -n ./install_bmad_linux.sh
          bash -n ./validate_setup.sh
      - name: Validate migration regressions
        run: python3 ./tests/run_migration_ci.py
      - name: Validate managed helper exact-ref integration
        run: python3 ./tests/run_managed_tools_integration.py
      - name: Validate installed toolchainctl bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          data="$root/data"
          bin="$root/bin"
          state="$root/state"
          config="$root/config"
          credential="$config/credentials"
          skills="$root/skills"
          projects="$root/projects"
          stash="$root/stash"

          export AGENT_TOOLCHAIN_DATA_DIR="$data"
          export AGENT_TOOLCHAIN_BIN_DIR="$bin"
          export AGENT_TOOLCHAIN_STATE_DIR="$state"
          export OPENCODE_CONFIG_DIR="$config"
          export OPENCODE_CREDENTIAL_DIR="$credential"
          export OPENCODE_SKILLS_DIR="$skills"
          export OPENCODE_PROJECTS_DIR="$projects"
          export OPENCODE_STASH_DIR="$stash"
          export PATH="$bin:$PATH"

          bash ./bootstrap_linux.sh
          test -x "$bin/toolchainctl"
          "$bin/toolchainctl" check --skip-package-install --skip-dependency-install
          for path in "$state" "$config" "$skills" "$projects" "$stash"; do
            test ! -e "$path"
          done

          bash ./bootstrap_linux.sh
          if compgen -G "$data/core.previous.*" >/dev/null; then
            echo "repeat bootstrap created a core backup despite unchanged fingerprint" >&2
            exit 1
          fi

          set +e
          tombstone_output="$(bash ./setup_linux.sh 2>&1)"
          tombstone_rc=$?
          set -e
          printf '%s\n' "$tombstone_output"
          test "$tombstone_rc" -eq 2
          grep -q 'removed as a supported interface' <<<"$tombstone_output"
      - name: Validate OpenCode core and BMAD regressions
        shell: bash
        run: |
          set +e
          output="$(bash ./validate_setup.sh --bmad 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ $rc -ne 0 ]]; then
            annotation="${output//'%'/'%25'}"
            annotation="${annotation//$'\r'/}"
            annotation="${annotation//$'\n'/'%0A'}"
            printf '::error title=Linux full validation::%s\n' "$annotation"
            exit "$rc"
          fi
